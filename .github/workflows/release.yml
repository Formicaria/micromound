name: Release

# Builds a tagged release, mirroring ANTHILL's release.yml: verify the tag matches the version
# in Directory.Build.props, publish self-contained binaries, and create a DRAFT GitHub Release
# with notes extracted from CHANGELOG.md. A broken or mismatched build can never publish.
#
# Trigger by tagging a commit whose MicromoundVersion already matches:
#   git tag v0.0.2
#   git push origin v0.0.2

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.0.2)'
        required: true

# Least privilege: only the job that creates the draft release gets write.
permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches MicromoundVersion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      ref: ${{ steps.extract.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Compare tag to Directory.Build.props
        id: extract
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CODE_VERSION=$(grep -oP '(?<=<MicromoundVersion>)[^<]+' Directory.Build.props)
          echo "Tag version:  $TAG_VERSION"
          echo "Code version: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match MicromoundVersion ($CODE_VERSION). Bump the version, commit, then re-tag."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.tag || github.ref }}" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Full V&V before packaging
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build + test (Release)
        run: |
          dotnet build Micromound.sln -c Release
          dotnet test Micromound.sln -c Release --no-build

  build-binaries:
    name: Publish ${{ matrix.rid }}
    needs: [verify-version, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64      # Pi-class targets — the point of the project
            archive: tar.gz
          - rid: win-x64
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # M0/M1 ship the simulator; when the Edge Queen runtime lands (M2), it joins this matrix.
      - name: Publish Micromound.Sim (${{ matrix.rid }})
        run: |
          dotnet publish src/Micromound.Sim/Micromound.Sim.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none \
            -o ./publish/${{ matrix.rid }}
          cp README.md CHANGELOG.md LICENSE ./publish/${{ matrix.rid }}/

      - name: Package (${{ matrix.archive }})
        run: |
          V="${{ needs.verify-version.outputs.version }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd ./publish/${{ matrix.rid }} && zip -r "../../micromound-$V-${{ matrix.rid }}.zip" .)
          else
            tar -czf "micromound-$V-${{ matrix.rid }}.tar.gz" -C ./publish/${{ matrix.rid }} .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: micromound-${{ needs.verify-version.outputs.version }}-${{ matrix.rid }}
          path: micromound-*-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [verify-version, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${{ needs.verify-version.outputs.version }}"
          awk -v ver="## v$V" '
            $0 ~ "^" ver { grab=1; next }
            grab && /^## v/ { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no '## v$V' section to extract."
            exit 1
          fi
          cat /tmp/notes.md

      # Draft on purpose: a human reads the notes and presses publish. Releases are not a place
      # for unattended automation to speak with the project's voice.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.verify-version.outputs.version }}"
          gh release create "v$V" ./artifacts/* \
            --draft \
            --title "v$V" \
            --notes-file /tmp/notes.md
